ht:64px;flex:none;border-radius:17px;background:linear-gradient(140deg,#5b57e6,#10c3b5);display:grid;place-items:center;font-size:29px;font-weight:800;overflow:hidden}.app-icon img{width:100%;height:100%;object-fit:cover}.app-icon.pink{background:linear-gradient(130deg,#fa5ca2,#a63bd9)}.app-icon.gold{background:linear-gradient(130deg,#ffc34e,#eb753f)}.app-icon.teal{background:linear-gradient(130deg,#37d3c6,#0f688b)}.panel{background:var(--panel);border:1px solid #2e3d49;border-radius:22px;padding:17px;margin-bottom:14px}.pane-note{background:#263642;border:1px solid #385465;border-radius:16px;padding:12px 14px;font-size:13px;line-height:1.8;color:#c8d5e1}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:var(--panel2);border-radius:16px;padding:15px}.stat strong{font-size:25px;display:block}.stat span{font-size:12px;color:#a9b9c6}.primary,.secondary{border:0;border-radius:16px;min-height:49px;padding:12px 17px;font-weight:700}.primary{background:#5062ff;color:white}.secondary{background:#293744;color:#e8f0f9}.outline{background:transparent;border:1px solid #425562;color:#e8eef5;border-radius:13px;padding:10px 13px;font-weight:600}.full{width:100%}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.row-wrap{display:flex;flex-wrap:wrap;gap:8px}.badge{display:inline-flex;align-items:center;gap:6px;color:#abf7df;background:#14483f;border-radius:30px;padding:6px 10px;font-size:12px}.steps{display:grid;gap:12px}.step{display:flex;gap:12px;align-items:flex-start}.step-num{background:#354f74;color:white;width:29px;height:29px;border-radius:10px;text-align:center;line-height:29px;flex:none}.step p{margin:3px 0;color:#acbdca;font-size:13px}.field{display:grid;gap:8px;margin:14px 0}.field label{font-weight:600}.field input,.field textarea{border:1px solid #3a4b59;border-radius:13px;background:#26333b;color:var(--ink);padding:13px;width:100%;outline:0}.field input:focus,.field textarea:focus{border-color:#849aff}.field textarea{min-height:100px;resize:vertical}.upload{border:1px dashed #5d6f80;border-radius:14px;padding:14px;color:#ced8e2}.bottom{position:fixed;bottom:0;right:0;left:0;background:#151e26f5;border-top:1px solid #2c3c48;display:flex;justify-content:space-around;padding:11px 8px calc(10px + env(safe-area-inset-bottom));z-index:9;backdrop-filter:blur(12px)}.tab{border:0;background:none;color:#8998a8;display:grid;justify-items:center;gap:5px;min-width:22%;padding:5px 0;font-size:12px}.tab .symbol{font-size:24px;line-height:27px}.tab.active{color:#8493ff;font-weight:800}.tab.active .symbol{filter:drop-shadow(0 0 8px #5062ff44)}.detail-top{display:flex;gap:15px;align-items:center;margin-bottom:20px}.detail-top .app-icon{width:88px;height:88px}.back{border:0;background:transparent;color:#b6c3d0;padding:4px 0 17px;font-weight:700}.line{height:1px;background:#34434f;margin:17px 0}.task{padding:12px;border:1px solid #364653;border-radius:12px;margin:8px 0;color:#dce6ee}.empty{padding:38px 12px;text-align:center;color:#adbcc9;border:1px dashed #394b59;border-radius:18px}.overlay{position:fixed;inset:0;background:#0c1119e8;z-index:20;display:grid;place-items:center;padding:16px}.welcome{width:100%;max-width:530px;background:#1c2833;border:1px solid #415469;border-radius:25px;padding:23px;box-shadow:0 20px 60px #000a}.welcome h2{font-size:24px}.welcome p{color:#bbc9d7}.brand-mark{width:60px;height:60px;display:grid;place-items:center;background:linear-gradient(135deg,#4b55ff,#12baaa);border-radius:20px;font-size:30px;margin-bottom:16px}.check{display:flex;align-items:start;gap:11px;line-height:1.8;font-size:13px;margin:17px 0}.check input{accent-color:#5062ff;width:19px;height:19px;flex:none;margin-top:3px}.progress{height:8px;background:#3b4d59;border-radius:12px;overflow:hidden}.progress span{display:block;height:100%;background:linear-gradient(90deg,#5666ff,#1dd1a9)}.toast{position:fixed;z-index:30;bottom:105px;right:12px;left:12px;max-width:450px;margin:auto;text-align:center;background:#334656;border:1px solid #7191a2;color:white;border-radius:12px;padding:11px;display:none}.toast.show{display:block}@media(min-width:670px){.bottom{left:calc(50% - 330px);right:calc(50% - 330px);border-left:1px solid #2c3c48;border-right:1px solid #2c3c48;border-radius:18px 18px 0 0}.shell{padding-top:24px}.app-icon{width:70px;height:70px}}@media(prefers-reduced-motion:no-preference){button,.app{transition:transform .14s ease}.app:active,.primary:active{transform:scale(.99)}}

<body>
<header><div class="inner"><div><div class="eyebrow">المنصة المطوّرة</div><h1 style="display:flex;align-items:center;gap:9px"><img src="https://raw.githubusercontent.com/alaaajeel/testerhub/main/assets/icon-192.png" width="34" height="34" alt="" style="width:34px;height:34px;border-radius:9px;background:white">TesterHub <span style="color:#60e2c2">V2</span></h1></div><span class="demo">تجريبي · بلا Firebase</span></div></header>
<main class="shell" id="app" aria-live="polite"></main>
<nav class="bottom" id="nav" aria-label="التنقل الرئيسي">
<button class="tab active" data-tab="apps"><span class="symbol">▦</span><span>التطبيقات</span></button>
<button class="tab" data-tab="groups"><span class="symbol">♧</span><span>المجموعات</span></button>
<button class="tab" data-tab="tests"><span class="symbol">☑</span><span>اختباراتي</span></button>
<button class="tab" data-tab="account"><span class="symbol">♙</span><span>حسابي</span></button>
</nav>
<div class="toast" role="status" id="toast"></div>
<div id="gate"></div>
<script>
"use strict";
const COMMUNITY="https://groups.google.com/g/testerhubiq";
const KEY="testerhub-v2-preview-state";
const starters=[
{id:"demo-1",name:"مفكرة اليوم",developer:"Demo Studio",desc:"تطبيق تجريبي لتنظيم الملاحظات والمهام اليومية، مع حفظ وتنبيه محلي.",tasks:"افتح التطبيق، أضف مهمة جديدة، عدّلها ثم جرّب حذفها وأرسل ملاحظاتك.",play:"https://play.google.com/store",group:"",reward:20,icon:"✦",tone:"pink"},
{id:"demo-2",name:"خطواتي",developer:"Sample Apps",desc:"تطبيق توضيحي لمتابعة عاداتك اليومية وقياس تقدمك.",tasks:"جرّب إنشاء عادة، تسجيل إنجاز، فتح الإحصائيات والتأكد من وضوح التنقل.",play:"https://play.google.com/store",group:"",reward:20,icon:"◈",tone:"teal"},
{id:"demo-3",name:"حاسبة الميزانية",developer:"Prototype Labs",desc:"نموذج لإدارة المصروفات والدخل واحتساب إجماليات شهرية.",tasks:"أضف مصروفاً ودخلاً، راجع الإجمالي، ثم اكتب تقريراً بما لاحظته.",play:"https://play.google.com/store",group:"",reward:25,icon:"◎",tone:"gold"}
];
function initial(){try{const v=JSON.parse(localStorage.getItem(KEY)||"{}");return {joined:!!v.joined,apps:Array.isArray(v.apps)?v.apps:[],tests:Array.isArray(v.tests)?v.tests:[],reports:v.reports&&typeof v.reports==="object"?v.reports:{}}}catch{return {joined:false,apps:[],tests:[],reports:{}}}}
const state={...initial(),tab:"apps",view:"",focusId:"",search:"",visitedOptin:false};
const $=q=>document.querySelector(q);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const apps=()=>[...state.apps,...starters];
const lookup=id=>apps().find(a=>a.id===id);
const validUrl=(v,hosts)=>{try{const u=new URL(v);return u.protocol==="https:"&&hosts.includes(u.hostname)&&!u.username&&!u.password&&u.port===""&&v.length<600}catch{return false}};
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify({joined:state.joined,apps:state.apps,tests:state.tests,reports:state.reports}))}catch{notify("مساحة تخزين المتصفح غير كافية؛ بعض البيانات التجريبية قد لا تُحفظ")}};
function notify(msg){const el=$("#toast");el.textContent=msg;el.classList.add("show");setTimeout(()=>el.classList.remove("show"),3800)}
function iconHTML(a){const img=a.image&&a.image.startsWith("data:image/")?'<img alt="" src="'+esc(a.image)+'">':esc(a.icon||"◈");return '<span class="app-icon '+esc(a.tone||"")+'">'+img+'</span>'}
function appRow(a){return '<button class="app" data-open="'+esc(a.id)+'">'+iconHTML(a)+'<span class="app-text"><span class="app-name">'+esc(a.name)+'</span><div class="app-author">'+esc(a.developer)+'</div></span><span class="app-reward"><b>'+Number(a.reward||20)+' XP</b>بعد تقرير مقبول</span><span class="chevron">‹</span></button>'}
function renderApps(){const matches=apps().filter(a=>(a.name+" "+a.developer).toLocaleLowerCase().includes(state.search.toLocaleLowerCase()));return '<div class="section-head"><div><h2>التطبيقات المتاحة</h2><div class="muted small">شوف التطبيقات واختار اللي تريد تختبره</div></div><button class="primary" id="add-app">+ إضافة تطبيق</button></div><div class="search"><span>⌕</span><input id="search" aria-label="البحث في التطبيقات" placeholder="ابحث باسم التطبيق أو المطور..." value="'+esc(state.search)+'"></div><div class="pane-note" style="margin-bottom:15px">هذه أسماء وبيانات توضيحية، ولا تمثل تطبيقات المستخدمين الحقيقيين. مكافآت XP لا تُصرف في المعاينة.</div><div class="stack" id="app-list">'+(matches.length?matches.map(appRow).join(""):'<div class="empty">ماكو تطبيق بهذا الاسم</div>')+'</div>'}
function renderGroups(){return '<div class="section-head"><h2>مجموعات التبادل</h2><span class="badge">واجهة قيد الربط</span></div><div class="panel"><h3>مجتمع المختبرين العام</h3><p class="muted">هذه العضوية المطلوبة عند دخول المنصة، لكن وجودها وحده لا يشترك تلقائياً في اختبار Google Play لكل تطبيق.</p><div class="row"><span class="badge">● '+(state.joined?"إقرار الانضمام محفوظ":"بانتظار الانضمام")+'</span><a href="'+COMMUNITY+'" target="_blank" rel="noopener noreferrer">رابط المجموعة</a></div></div><div class="panel"><div class="row"><h3>مجموعة التبادل · 15 مطور</h3><span class="badge">تصميم أولي</span></div><p class="muted">كل مطور يضيف تطبيقاً، وعند اكتمال المجموعة يختبر بقية التطبيقات. سيتم ربطها بفرع مجموعات التبادل بعد مراجعة الصلاحيات والقواعد.</p><div class="row"><span>0 / 15 (مثال)</span><span class="muted small">تحتاج تكامل Firebase</span></div><div class="progress" style="margin-top:12px"><span style="width:0%"></span></div></div><div class="pane-note">التسجيل الحالي في هذه المعاينة محلي فقط. لا يتم إنشاء مجموعة أو تسجيل عضوية في Firebase.</div>'}
function renderTests(){const items=state.tests.map(lookup).filter(Boolean);return '<div class="section-head"><h2>اختباراتي</h2><span class="badge">'+items.length+' تطبيقات</span></div><div class="stats" style="margin-bottom:15px"><div class="stat"><strong>'+items.length+'</strong><span>اختبارات انضممت لها تجريبياً</span></div><div class="stat"><strong>'+Object.keys(state.reports).length+'</strong><span>تقارير محلية</span></div></div>'+(items.length?'<div class="stack">'+items.map(a=>'<div class="panel"><div class="row">'+iconHTML(a)+'<div style="flex:1"><h3>'+esc(a.name)+'</h3><div class="small muted">'+esc(a.developer)+'</div></div><button class="outline" data-report="'+esc(a.id)+'">أكتب تقرير</button></div><div class="small muted" style="margin-top:10px">'+(state.reports[a.id]?"تم حفظ تقرير تجريبي محلي":"بانتظار تقرير تجربة فعلية")+'</div></div>').join("")+'</div>':'<div class="empty">بعدك ما أضفت أي تطبيق لاختباراتي. افتح التطبيقات واختار أحدها.</div>')+'<p class="muted small">لا تعتبر هذه الحالات إثباتاً لاختبار Google Play أو احتساب أيامه.</p>'}
function renderAccount(){return '<div class="section-head"><h2>حسابي</h2><span class="badge">وضع تجربة</span></div><div class="panel"><div class="row"><span class="app-icon">♙</span><div style="flex:1"><h3>حساب تجريبي</h3><div class="muted small">لا يوجد تسجيل دخول حقيقي في هذه المعاينة</div></div></div></div><div class="stats" style="margin-bottom:14px"><div class="stat"><strong>'+state.apps.length+'</strong><span>تطبيقاتي المضافة محلياً</span></div><div class="stat"><strong>0</strong><span>XP فعلية</span></div></div><div class="panel"><h3>ما سيتم نقله من الحساب الحالي</h3><p class="muted">البيانات الشخصية، تطبيقاتي، اختباراتي، البلاغات، الرسائل، الإعدادات، الموافقات والخصوصية. تبقى هوية المستخدم ومعرّفات سجلاته كما هي بعد ربط V2 بالإنتاج.</p></div><button class="outline full" id="reset-demo">مسح بيانات المعاينة من هذا المتصفح</button>'}
function renderAdd(){return '<button class="back" id="back">→ رجوع إلى التطبيقات</button><h2>إضافة تطبيق</h2><p class="sub">إضافة تطبيق واحد مجاناً. هذا النموذج تجريبي ولا ينشر شيئاً للمستخدمين.</p><form id="app-form"><div class="field"><label for="app-icon">أيقونة التطبيق (اختياري في المعاينة)</label><input id="app-icon" class="upload" type="file" accept="image/png,image/jpeg,image/webp"></div><div class="field"><label for="app-name">اسم التطبيق *</label><input id="app-name" maxlength="100" required placeholder="مثلاً: تطبيق مفكرتي"></div><div class="field"><label for="app-developer">اسم المطور *</label><input id="app-developer" maxlength="100" required placeholder="اسمك أو اسم شركتك"></div><div class="field"><label for="app-play">رابط Google Play أو الاختبار المغلق *</label><input id="app-play" type="url" required maxlength="500" placeholder="https://play.google.com/..."></div><div class="field"><label for="app-group">رابط مجموعة المختبرين (اختياري)</label><input id="app-group" type="url" maxlength="500" placeholder="https://groups.google.com/g/..."></div><div class="field"><label for="app-desc">وصف التطبيق *</label><textarea id="app-desc" required maxlength="1000" placeholder="شنو فكرة تطبيقك؟ ولمن مخصص؟"></textarea></div><div class="field"><label for="app-tasks">المهام المطلوبة من المختبرين *</label><textarea id="app-tasks" required maxlength="1200" placeholder="مثلاً: جرّب التسجيل، حفظ البيانات، الإشعارات، وأرسل ملاحظاتك"></textarea></div><button class="primary full" type="submit">حفظ التطبيق بالمعاينة</button></form>'}
function renderDetail(a){if(!a)return '<p>التطبيق غير موجود</p>';let joined=state.tests.includes(a.id);return '<button class="back" id="back">→ رجوع إلى التطبيقات</button><div class="detail-top">'+iconHTML(a)+'<div><h2 style="margin:0">'+esc(a.name)+'</h2><p class="muted" style="margin:4px 0">'+esc(a.developer)+'</p><span class="badge">'+Number(a.reward||20)+' XP بعد تقرير مقبول</span></div></div><div class="panel"><h3>عن التطبيق</h3><p>'+esc(a.desc)+'</p><div class="line"></div><h3>المهام المطلوبة</h3><div class="task">'+esc(a.tasks).replace(/\n/g,"<br>")+'</div></div><div class="panel"><h3>خطوات الانضمام للاختبار</h3><div class="steps"><div class="step"><span class="step-num">1</span><div>تأكد من قبولك بالمجموعة المناسبة<p>عضوية المجموعة العامة وحدها لا تكفي لتفعيل اختبار Google Play لكل تطبيق.</p></div></div><div class="step"><span class="step-num">2</span><div>افتح رابط الاشتراك الخاص بالتطبيق<p>يحتاج كل تطبيق opt-in منفصل، بحساب Google المؤهل عند المطور.</p></div></div><div class="step"><span class="step-num">3</span><div>ثبّت التطبيق واختبر المهام<p>سجل الملاحظات والبلاغات فعلياً. لا تُمنح النقاط بمجرد الضغط.</p></div></div></div></div><div class="stack"><button class="primary full" id="open-play">فتح رابط Google Play ↗</button>'+(a.group?'<button class="secondary full" id="open-group">فتح مجموعة التطبيق ↗</button>':'')+'<button class="outline full" id="join-test" '+(joined?'disabled':'')+'>'+(joined?'مضاف إلى اختباراتي (تجريبي)':'أقر أني أكملت الاشتراك عبر Google Play')+'</button></div><p class="small muted">الإقرار أعلاه محلي للمعاينة فقط، وليس تحققاً من Google Play.</p>'}
function renderReport(a){return '<button class="back" id="back-tests">→ رجوع إلى اختباراتي</button><h2>تقرير اختبار: '+esc(a.name)+'</h2><div class="pane-note">هذا تقرير تجريبي محلي. في النسخة الفعلية يتبع قواعد Firestore وسجل الاختبار والمراجعة.</div><form id="report-form"><div class="field"><label for="report-text">شنو جرّبت؟ وشنو النتيجة؟ *</label><textarea id="report-text" minlength="15" maxlength="2000" required placeholder="اشرح الميزة اللي جرّبتها، النتيجة، وأي مشكلة واجهتك...">'+esc(state.reports[a.id]||"")+'</textarea></div><button class="primary full" type="submit">حفظ التقرير التجريبي</button></form>'}
function render(){const root=$("#app");if(state.view==="add")root.innerHTML=renderAdd();else if(state.view==="detail")root.innerHTML=renderDetail(lookup(state.focusId));else if(state.view==="report")root.innerHTML=renderReport(lookup(state.focusId));else root.innerHTML=({apps:renderApps,groups:renderGroups,tests:renderTests,account:renderAccount}[state.tab]||renderApps)();document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.tab===state.tab));renderGate()}
function renderGate(){if(state.joined){$("#gate").innerHTML="";return}$("#gate").innerHTML='<div class="overlay"><div class="welcome"><div class="brand-mark">♧</div><div class="eyebrow">الخطوة الأولى بعد إنشاء الحساب</div><h2>انضم إلى مجتمع المختبرين</h2><p>قبل ما تستخدم TesterHub، مطلوب الانضمام لمجموعة المختبرين. بعدين تقدر تستعرض كل التطبيقات، ولكل تطبيق رابط اشتراك Google Play خاص بيه.</p><div class="pane-note">هذه معاينة فقط: ماكو تحقق مباشر من عضوية Google Groups أو إنشاء حساب حقيقي.</div><p><a href="'+COMMUNITY+'" target="_blank" rel="noopener noreferrer" id="open-community">فتح مجموعة المختبرين ↗</a></p><label class="check"><input id="join-check" type="checkbox"><span>أقر بأني طلبت الانضمام للمجموعة، وأفهم أن كل تطبيق يتطلب اشتراكاً مستقلاً في اختباره المغلق.</span></label><button class="primary full" id="finish-join" disabled>إكمال الخطوة ودخول المعاينة</button></div></div>'}
async function resizedIcon(file){if(!file)return "";if(!["image/jpeg","image/png","image/webp"].includes(file.type)||file.size>2*1024*1024)throw Error("اختار PNG أو JPG أو WEBP بحجم لا يتجاوز 2MB");return new Promise((resolve,reject)=>{const img=new Image();const u=URL.createObjectURL(file);img.onload=()=>{try{const canvas=document.createElement("canvas");canvas.width=128;canvas.height=128;const ctx=canvas.getContext("2d");ctx.fillStyle="#253642";ctx.fillRect(0,0,128,128);let r=Math.min(128/img.width,128/img.height),w=img.width*r,h=img.height*r;ctx.drawImage(img,(128-w)/2,(128-h)/2,w,h);URL.revokeObjectURL(u);resolve(canvas.toDataURL("image/jpeg",.78))}catch(e){URL.revokeObjectURL(u);reject(e)}};img.onerror=()=>{URL.revokeObjectURL(u);reject(Error("تعذّر قراءة الأيقونة"))};img.src=u})}
document.addEventListener("click",async e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.tab){state.tab=b.dataset.tab;state.view="";state.search="";render();scrollTo(0,0);return}if(b.dataset.open){state.focusId=b.dataset.open;state.view="detail";state.visitedOptin=false;render();scrollTo(0,0);return}if(b.id==="add-app"){state.view="add";render();return}if(b.id==="back"){state.view="";state.tab="apps";render();return}if(b.id==="back-tests"){state.view="";state.tab="tests";render();return}if(b.id==="finish-join"){if($("#join-check")?.checked){state.joined=true;persist();render();notify("تم الدخول إلى المعاينة، بدون تحقق فعلي من عضوية Google")};return}if(b.id==="open-play"){const a=lookup(state.focusId);if(validUrl(a?.play,["play.google.com"])){window.open(a.play,"_blank","noopener,noreferrer");state.visitedOptin=true}else notify("رابط Google Play غير صالح");return}if(b.id==="open-group"){const a=lookup(state.focusId);if(validUrl(a?.group,["groups.google.com"])){window.open(a.group,"_blank","noopener,noreferrer")}else notify("رابط المجموعة غير صالح");return}if(b.id==="join-test"){if(!state.visitedOptin){notify("افتح رابط Google Play أولاً، ثم ارجع لتأكيد إقرارك");return}if(!state.tests.includes(state.focusId)){state.tests.push(state.focusId);persist();render();notify("أضيف إلى اختباراتي محلياً؛ لم يتم التحقق من Google Play")}return}if(b.dataset.report){state.focusId=b.dataset.report;state.view="report";render();return}if(b.id==="reset-demo"){if(confirm("هل تريد مسح بيانات المعاينة المحلية فقط؟")){localStorage.removeItem(KEY);location.reload()}return}});
document.addEventListener("change",e=>{if(e.target.id==="join-check"){$("#finish-join").disabled=!e.target.checked}});
document.addEventListener("input",e=>{if(e.target.id==="search"){state.search=e.target.value;const matches=apps().filter(a=>(a.name+" "+a.developer).toLocaleLowerCase().includes(state.search.toLocaleLowerCase()));$("#app-list").innerHTML=matches.length?matches.map(appRow).join(""):'<div class="empty">ماكو تطبيق بهذا الاسم</div>'}});
document.addEventListener("submit",async e=>{if(e.target.id==="app-form"){e.preventDefault();if(state.apps.length>=1){notify("في نموذج المعاينة: تطبيق مجاني واحد فقط");return}const get=id=>$("#"+id).value.trim();const name=get("app-name"),developer=get("app-developer"),play=get("app-play"),group=get("app-group"),desc=get("app-desc"),tasks=get("app-tasks");if(!validUrl(play,["play.google.com"])){notify("رابط Play يجب أن يكون على play.google.com وبصيغة https");return}if(group&&!validUrl(group,["groups.google.com"])){notify("رابط المجموعة يجب أن يكون من groups.google.com");return}if(name.length<2||developer.length<2||desc.length<10||tasks.length<10){notify("رجاءً اكتب أسماء صحيحة ووصفاً ومهاماً واضحة");return}try{const image=await resizedIcon($("#app-icon").files[0]);state.apps.unshift({id:"local-"+Date.now(),name,developer,play,group,desc,tasks,image,icon:"◈",tone:"teal",reward:20});persist();state.view="";state.search="";render();notify("تمت إضافة التطبيق للمعاينة فقط، بدون نشر")}catch(err){notify(err.message)}return}if(e.target.id==="report-form"){e.preventDefault();const body=$("#report-text").value.trim();if(body.length<15){notify("التقرير يحتاج تفاصيل أكثر");return}state.reports[state.focusId]=body;persist();state.view="";state.tab="tests";render();notify("حُفظ التقرير محلياً دون XP حقيقية");return}});
render();
</script>
</body>
