.profile-avatar{width:84px;height:84px;font-size:26px;box-shadow:0 12px 24px #052d735b}
.avatar-edit{border:0;background:none;color:white;padding:0;position:relative;flex:none;cursor:pointer;border-radius:50%;display:inline-flex}
.avatar-edit:focus-visible{outline:3px solid #f9e69c;outline-offset:4px}
.avatar-camera{position:absolute;left:-3px;bottom:-3px;width:31px;height:31px;display:grid;place-items:center;border:2px solid white;background:#05a981;border-radius:11px;box-shadow:0 4px 10px #153f6530}
.avatar-edit:hover .avatar-camera{background:#0cc696}
.profile-hint{color:#e3f7ff;font-size:11px;margin:7px 0 0}
.profile-top .muted{color:#d8ecff}
.profile-section-label{font-size:12px;letter-spacing:.25px}
.profile-rank-mark{background:linear-gradient(135deg,#e5f3ff,#d7f9eb);color:#125aae}
.profile-setting{cursor:pointer}
.profile-setting>span:first-child{display:flex;align-items:center;gap:9px}
.profile-setting svg{color:#1d78b4}
.welcome{background:#fff}
@media(max-width:370px){.demo{display:none}.balance-pill small{display:none}.balance-hero .wallet-cta{left:9px;padding:8px}}
</style>
</head>
<body>
<header><div class="inner"><div><div class="eyebrow">المنصة المطوّرة</div><h1 style="display:flex;align-items:center;gap:9px"><img src="https://raw.githubusercontent.com/alaaajeel/testerhub/main/assets/icon-192.png" width="34" height="34" alt="" style="width:34px;height:34px;border-radius:9px;background:white">TesterHub <span style="color:#60e2c2">V2</span></h1></div><div class="header-actions"><button class="balance-pill" id="balance-pill" aria-label="فتح محفظة هب كوين">رصيدك</button><span class="demo">معاينة</span></div></div></header>
<main class="shell" id="app" aria-live="polite"></main>
<nav class="bottom" id="nav" aria-label="التنقل الرئيسي">
<button class="tab active" data-tab="apps"><span class="symbol"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></span><span>التطبيقات</span></button>
<button class="tab" data-tab="groups"><span class="symbol"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg></span><span>المجموعات</span></button>
<button class="tab" data-tab="tests"><span class="symbol"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 10h18"/><path d="m9 16 2 2 4-4"/></svg></span><span>اختباراتي</span></button>
<button class="tab" data-tab="account"><span class="symbol"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></span><span>حسابي</span></button>
</nav>
<div class="toast" role="status" id="toast"></div>
<div id="gate"></div>
<script>
"use strict";
const COMMUNITY="https://groups.google.com/g/testerhubiq";
const KEY="testerhub-v2-preview-state";

const ECONOMY={welcome:100,reportApproved:25,secondSlot:250,maxDailyReports:5};
const DAY=()=>new Date().toISOString().slice(0,10);
function newWallet(){return {balance:ECONOMY.welcome,slots:1,ledger:[{id:"welcome",type:"welcome",amount:ECONOMY.welcome,day:DAY(),title:"هدية التسجيل الأولى"}]}}
function walletFromSaved(wallet){if(!wallet||!Number.isSafeInteger(wallet.balance)||wallet.balance<0)return newWallet();return {balance:wallet.balance,slots:wallet.slots===2?2:1,ledger:Array.isArray(wallet.ledger)?wallet.ledger.slice(0,100):[]}}
const ICONS={
grid:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
group:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
check:'<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 10h18"/><path d="m9 16 2 2 4-4"/>',
user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
camera:'<path d="M14 4h-4L8 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-4z"/><circle cx="12" cy="13" r="3"/>',
coins:'<circle cx="12" cy="12" r="9"/><path d="M12 6v12M15.5 8.5c-.7-1-1.8-1.5-3.5-1.5-1.9 0-3.5.9-3.5 2.7 0 1.5 1.3 2.2 3.5 2.5s3.5 1 3.5 2.5S14 17 12 17c-1.6 0-2.9-.6-3.7-1.7"/>',
gift:'<rect x="3" y="8" width="18" height="13" rx="2"/><path d="M12 8v13M3 12h18"/><path d="M12 8c-3-1-5-2-5-4a2 2 0 0 1 4 0l1 4zM12 8c3-1 5-2 5-4a2 2 0 0 0-4 0z"/>',
sparkles:'<path d="m12 3 1.8 6.2L20 11l-6.2 1.8L12 19l-1.8-6.2L4 11l6.2-1.8zM19 18l1 3 1-3M4 18l.8 2.3L7 21l-2.2.7L4 24"/>',
plus:'<path d="M12 5v14M5 12h14"/>',
arrow:'<path d="m9 18 6-6-6-6"/>',
shield:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/>',
bell:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/>',
target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',
book:'<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>',
chart:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M7 16v-4M12 16V8M17 16v-6"/>',
list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
lock:'<rect x="4" y="10" width="16" height="12" rx="2"/><path d="M8 10V7a4 4 0 1 1 8 0v3"/>',
search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>',
zap:'<path d="M13 2 4 13h7l-1 9 10-12h-7z"/>',
circleCheck:'<circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/>',
warning:'<path d="M10 3.3 2 18a2 2 0 0 0 1.8 3h16.4A2 2 0 0 0 22 18L14 3.3a2.3 2.3 0 0 0-4 0z"/><path d="M12 9v5M12 18h.01"/>',
phone:'<rect x="6" y="2" width="12" height="20" rx="2"/><path d="M11 18h2"/>',
rocket:'<path d="M4.5 16.5 8 13l3 3-3.5 3.5zM8 13c2-6 7-9 13-10-1 6-4 11-10 13z"/><path d="M13 7a2 2 0 1 0 4 0 2 2 0 0 0-4 0M4 20l-1 1"/>',
award:'<circle cx="12" cy="8" r="6"/><path d="m8.5 13-1 9L12 19l4.5 3-1-9"/>',
menu:'<path d="M4 7h16M4 12h16M4 17h16"/>',
info:'<circle cx="12" cy="12" r="10"/><path d="M12 11v5M12 7h.01"/>',
edit:'<path d="m15 5 4 4M4 20l5-1 11-11a3 3 0 0 0-4-4L5 15z"/>'
};
const ico=(name,size=20)=>'<svg aria-hidden="true" width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block;vertical-align:middle;flex:none">'+(ICONS[name]||ICONS.grid)+'</svg>';
function syncHeader(){
 const badge=document.getElementById("balance-pill");if(badge)badge.innerHTML=ico("coins",16)+'<strong>'+state.wallet.balance+'</strong><small>هب كوين</small>';
}
function approvedRewardsToday(){return state.wallet.ledger.filter(x=>x.type==="report"&&x.day===DAY()).length}
function hasApprovedReport(id){return state.wallet.ledger.some(x=>x.type==="report"&&x.id==="report:"+id+":"+DAY())}
function approveDemoReport(id){
 if(!state.reports[id]){notify("لازم تكتب التقرير أولاً");return}
 if(state.apps.some(a=>a.id===id)){notify("ماكو مكافأة لاختبار تطبيقك الخاص");return}
 const rewardId="report:"+id+":"+DAY();
 if(state.wallet.ledger.some(x=>x.id===rewardId)){notify("مكافأة اليوم لهذا التطبيق انحسبت مسبقاً");return}
 if(approvedRewardsToday()>=ECONOMY.maxDailyReports){notify("وصلت للحد اليومي التجريبي من المكافآت");return}
 state.wallet.balance+=ECONOMY.reportApproved;
 state.wallet.ledger.unshift({id:rewardId,type:"report",amount:ECONOMY.reportApproved,day:DAY(),title:"قبول تقرير: "+(lookup(id)?.name||"تطبيق")});
 persist();render();notify("محاكاة قبول تقرير: +25 هب كوين (داخل المعاينة فقط)");
}

const starters=[
{id:"demo-1",name:"مفكرة اليوم",developer:"Demo Studio",desc:"تطبيق تجريبي لتنظيم الملاحظات والمهام اليومية، مع حفظ وتنبيه محلي.",tasks:"افتح التطبيق، أضف مهمة جديدة، عدّلها ثم جرّب حذفها وأرسل ملاحظاتك.",play:"https://play.google.com/store",group:"",reward:20,icon:"✦",tone:"pink"},
{id:"demo-2",name:"خطواتي",developer:"Sample Apps",desc:"تطبيق توضيحي لمتابعة عاداتك اليومية وقياس تقدمك.",tasks:"جرّب إنشاء عادة، تسجيل إنجاز، فتح الإحصائيات والتأكد من وضوح التنقل.",play:"https://play.google.com/store",group:"",reward:20,icon:"◈",tone:"teal"},
{id:"demo-3",name:"حاسبة الميزانية",developer:"Prototype Labs",desc:"نموذج لإدارة المصروفات والدخل واحتساب إجماليات شهرية.",tasks:"أضف مصروفاً ودخلاً، راجع الإجمالي، ثم اكتب تقريراً بما لاحظته.",play:"https://play.google.com/store",group:"",reward:25,icon:"◎",tone:"gold"}
];
function initial(){try{const v=JSON.parse(localStorage.getItem(KEY)||"{}");return {joined:!!v.joined,apps:Array.isArray(v.apps)?v.apps:[],tests:Array.isArray(v.tests)?v.tests:[],reports:v.reports&&typeof v.reports==="object"?v.reports:{},profile:v.profile&&typeof v.profile==="object"?{name:String(v.profile.name||"مستخدم تجريبي").slice(0,80),image:String(v.profile.image||"").startsWith("data:image/")?v.profile.image:""}:{name:"مستخدم تجريبي",image:""},wallet:walletFromSaved(v.wallet)}}catch{return {joined:false,apps:[],tests:[],reports:{},profile:{name:"مستخدم تجريبي",image:""},wallet:newWallet()}}}
const state={...initial(),tab:"apps",view:"",focusId:"",search:"",visitedOptin:false,returnTab:"apps"};
const $=q=>document.querySelector(q);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const apps=()=>[...state.apps,...starters];
const lookup=id=>apps().find(a=>a.id===id);
const validUrl=(v,hosts)=>{try{const u=new URL(v);return u.protocol==="https:"&&hosts.includes(u.hostname)&&!u.username&&!u.password&&u.port===""&&v.length<600}catch{return false}};
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify({joined:state.joined,apps:state.apps,tests:state.tests,reports:state.reports,profile:state.profile,wallet:state.wallet}))}catch{notify("مساحة تخزين المتصفح غير كافية؛ بعض البيانات التجريبية قد لا تُحفظ")}};
function notify(msg){const el=$("#toast");el.textContent=msg;el.classList.add("show");setTimeout(()=>el.classList.remove("show"),3800)}
function iconHTML(a){const img=a.image&&a.image.startsWith("data:image/")?'<img alt="" src="'+esc(a.image)+'">':esc(a.icon||"◈");return '<span class="app-icon '+esc(a.tone||"")+'">'+img+'</span>'}
function appRow(a){return '<button class="app" data-open="'+esc(a.id)+'">'+iconHTML(a)+'<span class="app-text"><span class="app-name">'+esc(a.name)+'</span><div class="app-author">'+esc(a.developer)+'</div></span><span class="app-reward"><b>'+Number(a.reward||20)+' XP</b>بعد تقرير مقبول</span><span class="chevron">‹</span></button>'}
function renderApps(){const matches=apps().filter(a=>(a.name+" "+a.developer).toLocaleLowerCase().includes(state.search.toLocaleLowerCase()));return '<div class="section-head"><div><h2>التطبيقات المتاحة</h2><div class="muted small">شوف التطبيقات واختار اللي تريد تختبره</div></div><button class="primary" id="add-app">+ إضافة تطبيق</button></div><div class="search"><span>⌕</span><input id="search" aria-label="البحث في التطبيقات" placeholder="ابحث باسم التطبيق أو المطور..." value="'+esc(state.search)+'"></div><div class="pane-note" style="margin-bottom:15px">هذه أسماء وبيانات توضيحية، ولا تمثل تطبيقات المستخدمين الحقيقيين. مكافآت XP لا تُصرف في المعاينة.</div><div class="stack" id="app-list">'+(matches.length?matches.map(appRow).join(""):'<div class="empty">ماكو تطبيق بهذا الاسم</div>')+'</div>'}
function renderGroups(){
 const sample=[...state.apps,...starters].slice(0,15),filled=sample.length,capacity=15;
 const slots=Array.from({length:capacity},(_,i)=>{const a=sample[i];return a?'<div class="group-slot filled"><button data-open="'+esc(a.id)+'" title="'+esc(a.name)+'" aria-label="عرض تطبيق '+esc(a.name)+'">'+iconHTML(a)+'</button></div>':'<div class="group-slot" title="مقعد شاغر" aria-label="مقعد شاغر">＋</div>'}).join("");
 return '<div class="section-head"><h2>مجموعات التبادل</h2><span class="badge">تصميم تجريبي</span></div>'+
 '<div class="group-hero"><div class="group-meta"><div><div class="badge" style="margin-bottom:8px">● مقاعد شاغرة (مثال)</div><div class="group-title">مجموعة التبادل الأولى</div><div class="group-hint">مجموعة مطورين لاختبار تطبيقات بعضهم</div></div><div style="text-align:left"><div class="group-count">'+filled+'/'+capacity+'</div><small class="muted">تطبيقات نموذجية</small></div></div><div class="group-apps">'+slots+'</div><div class="group-hint">اضغط أيقونة أي تطبيق تشوف تفاصيله ومهام الاختبار. جميع التطبيقات والأعداد الظاهرة هنا توضيحية وليست أعضاء فعليين.</div><div class="progress" style="margin:15px 0 17px"><span style="width:'+(filled/capacity*100)+'%"></span></div><button class="primary full" id="show-journey">تعليمات التبادل ↓</button></div>'+
 '<div class="panel" id="journey"><h3>رحلة المجموعة من البداية للنهاية</h3><div class="journey-list">'+
 '<div class="journey-step"><span class="journey-symbol">👥</span><div class="journey-body"><strong>1. اكتمال المجموعة</strong><p>تنضم 15 حسابات مطورين إلى مجموعة واحدة، ولكل مطور تطبيق واحد.</p></div></div>'+
 '<div class="journey-step"><span class="journey-symbol">▣</span><div class="journey-body"><strong>2. تجهيز التطبيقات</strong><p>كل عضو يطلع على تطبيقات الأعضاء الـ14 وروابط الاختبار المغلق، ويتأكد من أهليته في Google Play.</p></div></div>'+
 '<div class="journey-step"><span class="journey-symbol">✓</span><div class="journey-body"><strong>3. الاختبار اليومي</strong><p>يختبر العضو تطبيقات زملائه ويسجل التأكيدات والملاحظات يومياً، والتطبيق يعرض التقدم والتذكيرات.</p></div></div>'+
 '<div class="journey-step"><span class="journey-symbol">★</span><div class="journey-body"><strong>4. إكمال 14 يوماً</strong><p>متابعة الالتزام طوال 14 يوماً، مع تمييز إنجازات المنصة عن شروط التحقق المستقلة في Google Play.</p></div></div>'+
 '</div></div>'+
 '<div class="panel"><h3>قواعد الالتزام</h3><div class="rule-box">'+
 '<div class="rule-row"><span class="rule-icon">✅</span><span>سجّل تأكيداً مستقلاً لكل تطبيق اختبرته فعلياً في نفس اليوم.</span></div>'+
 '<div class="rule-row"><span class="rule-icon">🔔</span><span>يقدر الأعضاء يرسلون تذكيراً داخل المجموعة للمختبر المتأخر.</span></div>'+
 '<div class="rule-row"><span class="rule-icon">⚠️</span><span>بعد 3 إنذارات موثقة لأيام مختلفة، يقدر مشرف المجموعة يستبعد العضو ويفتح مقعداً بديلاً، حسب قواعد النظام التجريبي.</span></div>'+
 '<div class="rule-row"><span class="rule-icon">🛡️</span><span>التأكيد الذاتي مو إثبات أن Google Play احتسب يوم الاختبار، ولا يجوز عرض بريد العضو إلا بموافقته.</span></div></div></div>'+
 '<div class="panel"><div class="row"><h3>المجتمع العام للمختبرين</h3><span class="badge">'+(state.joined?"إقرار تجريبي":"غير منضم")+'</span></div><p class="muted">هذا المجتمع الرسمي يختلف عن مجموعة تبادل الـ15 شخصاً. رابط الانضمام العام موجود في بوابة التسجيل، وليس داخل نموذج إضافة التطبيق.</p><a href="'+COMMUNITY+'" target="_blank" rel="noopener noreferrer">فتح المجتمع العام ↗</a></div>'+
 '<div class="pane-note">المجموعة المعروضة هي مثال لتجربة التصميم فقط. الصور الحقيقية للتطبيقات المنضمة تُجلب عند ربط V2 بسجلات التطبيقات والمجموعات في Firebase بعد التحقق من الصلاحيات.</div>';
}

function renderTests(){const items=state.tests.map(lookup).filter(Boolean);return '<div class="section-head"><h2>اختباراتي</h2><span class="badge">'+items.length+' تطبيقات</span></div><div class="stats" style="margin-bottom:15px"><div class="stat"><strong>'+items.length+'</strong><span>اختبارات انضممت لها تجريبياً</span></div><div class="stat"><strong>'+Object.keys(state.reports).length+'</strong><span>تقارير محلية</span></div></div>'+(items.length?'<div class="stack">'+items.map(a=>'<div class="panel"><div class="row">'+iconHTML(a)+'<div style="flex:1"><h3>'+esc(a.name)+'</h3><div class="small muted">'+esc(a.developer)+'</div></div><button class="outline" data-report="'+esc(a.id)+'">أكتب تقرير</button></div><div class="small muted" style="margin-top:10px">'+(state.reports[a.id]?"تم حفظ تقرير تجريبي محلي":"بانتظار تقرير تجربة فعلية")+'</div></div>').join("")+'</div>':'<div class="empty">بعدك ما أضفت أي تطبيق لاختباراتي. افتح التطبيقات واختار أحدها.</div>')+'<p class="muted small">لا تعتبر هذه الحالات إثباتاً لاختبار Google Play أو احتساب أيامه.</p>'}
function profileAvatar(){const image=state.profile?.image;return '<span class="profile-avatar">'+(image&&image.startsWith("data:image/")?'<img src="'+esc(image)+'" alt="صورة الحساب">':'👤')+'</span>'}
function renderAccount(){
 const name=esc(state.profile?.name||"مستخدم تجريبي");
 const reportCount=Object.keys(state.reports).length;
 return '<div class="section-head"><h2>حسابي</h2><button class="outline" id="save-profile">حفظ الملف</button></div>'+
 '<div class="profile-top"><div class="row">'+profileAvatar()+'<div style="flex:1"><h2>'+name+'</h2><p class="muted small" style="margin:4px 0">الملف الشخصي · نموذج معاينة</p><label for="profile-photo" class="profile-photo">📷 تغيير الصورة</label><input id="profile-photo" style="display:none" type="file" accept="image/png,image/jpeg,image/webp"></div></div></div>'+
 '<div class="profile-section-label">الملف العام</div><div class="panel"><div class="field" style="margin:0"><label for="profile-name">الاسم الظاهر للآخرين</label><input id="profile-name" maxlength="80" minlength="2" value="'+name+'" placeholder="اسمك الظاهر"></div></div>'+
 '<div class="profile-section-label">بيانات الحساب</div><div class="panel"><div class="profile-row"><span class="muted">البريد الإلكتروني</span><strong class="small">يظهر بعد ربط الحساب الحقيقي 🔒</strong></div><div class="profile-row"><span class="muted">حالة الحساب</span><span class="badge">معاينة غير متصلة</span></div></div>'+
 '<div class="profile-section-label">السمعة والمساهمة</div><div class="panel"><div class="profile-rank"><span class="profile-rank-mark">0</span><div><h3 style="margin:0">عضو جديد</h3><small>XP الفعلية: غير متصلة · السمعة تُحسب من النشاط الموثق</small></div></div><div class="line"></div><div class="stats"><div class="stat"><strong>'+state.apps.length+'</strong><span>تطبيقاتي المحلية</span></div><div class="stat"><strong>'+state.tests.length+'</strong><span>اختبارات انضممت لها تجريبياً</span></div><div class="stat"><strong>'+reportCount+'</strong><span>تقارير تجريبية</span></div><div class="stat"><strong>0</strong><span>نقاط XP حقيقية</span></div></div></div>'+
 '<div class="profile-section-label">نقاطي والمكافآت</div><div class="panel"><div class="profile-row"><span>🏅 نقاط الخبرة XP</span><strong>غير متصلة</strong></div><div class="profile-row"><span>🤝 مساهمات الاختبار</span><strong>'+reportCount+' تجريبي</strong></div><p class="small muted" style="margin-bottom:0">لا توجد عملة Moons في TesterHub حالياً؛ المعاينة لا تمنح نقاطاً أو تفرض غرامات حقيقية.</p></div>'+
 '<div class="profile-section-label">الإعدادات والمساعدة</div><div class="panel">'+
 '<button class="profile-setting" id="profile-my-apps"><span>▣ تطبيقاتي</span><span>‹</span></button>'+
 '<button class="profile-setting" id="profile-my-tests"><span>☑ اختباراتي وتقاريري</span><span>‹</span></button>'+
 '<button class="profile-setting" id="profile-privacy"><span>🛡️ الخصوصية وإعدادات الحساب</span><span>‹</span></button>'+
 '</div><div class="pane-note" style="margin-bottom:14px">الاسم والصورة ينحفظن بهذا المتصفح فقط. بيانات حسابات Firebase الحالية تبقى دون أي تعديل.</div>'+
 '<button class="outline full" id="reset-demo">مسح بيانات المعاينة من هذا المتصفح</button>';
}

function renderAdd(){return '<button class="back" id="back">→ رجوع إلى التطبيقات</button><h2>إضافة تطبيق</h2><p class="sub">أول تطبيق مجاني. التطبيق الثاني يحتاج فتح مساحة إضافية من رصيد مساهمتك. هذا نموذج تجريبي محلي.</p><form id="app-form"><div class="field"><label for="app-icon">أيقونة التطبيق (اختياري في المعاينة)</label><input id="app-icon" class="upload" type="file" accept="image/png,image/jpeg,image/webp"></div><div class="field"><label for="app-name">اسم التطبيق *</label><input id="app-name" maxlength="100" required placeholder="مثلاً: تطبيق مفكرتي"></div><div class="field"><label for="app-developer">اسم المطور *</label><input id="app-developer" maxlength="100" required placeholder="اسمك أو اسم شركتك"></div><div class="field"><label for="app-play">رابط Google Play أو الاختبار المغلق *</label><input id="app-play" type="url" required maxlength="500" placeholder="https://play.google.com/..."></div><div class="field"><label for="app-desc">وصف التطبيق *</label><textarea id="app-desc" required maxlength="1000" placeholder="شنو فكرة تطبيقك؟ ولمن مخصص؟"></textarea></div><div class="field"><label for="app-tasks">المهام المطلوبة من المختبرين *</label><textarea id="app-tasks" required maxlength="1200" placeholder="مثلاً: جرّب التسجيل، حفظ البيانات، الإشعارات، وأرسل ملاحظاتك"></textarea></div><button class="primary full" type="submit">حفظ التطبيق بالمعاينة</button></form>'}
function renderDetail(a){if(!a)return '<p>التطبيق غير موجود</p>';let joined=state.tests.includes(a.id);return '<button class="back" id="back">→ رجوع إلى التطبيقات</button><div class="detail-top">'+iconHTML(a)+'<div><h2 style="margin:0">'+esc(a.name)+'</h2><p class="muted" style="margin:4px 0">'+esc(a.developer)+'</p><span class="badge">'+Number(a.reward||20)+' XP بعد تقرير مقبول</span></div></div><div class="panel"><h3>عن التطبيق</h3><p>'+esc(a.desc)+'</p><div class="line"></div><h3>المهام المطلوبة</h3><div class="task">'+esc(a.tasks).replace(/\n/g,"<br>")+'</div></div><div class="panel"><h3>خطوات الانضمام للاختبار</h3><div class="steps"><div class="step"><span class="step-num">1</span><div>تأكد من قبولك بالمجموعة المناسبة<p>عضوية المجموعة العامة وحدها لا تكفي لتفعيل اختبار Google Play لكل تطبيق.</p></div></div><div class="step"><span class="step-num">2</span><div>افتح رابط الاشتراك الخاص بالتطبيق<p>يحتاج كل تطبيق opt-in منفصل، بحساب Google المؤهل عند المطور.</p></div></div><div class="step"><span class="step-num">3</span><div>ثبّت التطبيق واختبر المهام<p>سجل الملاحظات والبلاغات فعلياً. لا تُمنح النقاط بمجرد الضغط.</p></div></div></div></div><div class="stack"><button class="primary full" id="open-play">فتح رابط Google Play ↗</button><button class="outline full" id="join-test" '+(joined?'disabled':'')+'>'+(joined?'مضاف إلى اختباراتي (تجريبي)':'أقر أني أكملت الاشتراك عبر Google Play')+'</button></div><p class="small muted">الإقرار أعلاه محلي للمعاينة فقط، وليس تحققاً من Google Play.</p>'}

function renderWallet(){
 const remaining=Math.max(0,ECONOMY.secondSlot-state.wallet.balance);
 return '<button class="back" id="back-wallet">'+ico("arrow",16)+' رجوع</button>'+
 '<div class="wallet-hero"><div class="wallet-hero-top"><span class="wallet-chip">'+ico("sparkles",15)+' مكافآت المساهمة</span><span class="wallet-hero-symbol">'+ico("coins",28)+'</span></div><div class="wallet-balance">'+state.wallet.balance+'<span> هب كوين</span></div><div class="wallet-caption">رصيد تجريبي · لا يُشترى ولا يُحوَّل إلى نقود</div><div class="wallet-glow"></div></div>'+
 '<div class="wallet-grid"><div class="wallet-metric">'+ico("gift",20)+'<strong>100</strong><small>ترحيب لأول مرة</small></div><div class="wallet-metric">'+ico("circleCheck",20)+'<strong>+25</strong><small>عن تقرير مقبول</small></div><div class="wallet-metric">'+ico("award",20)+'<strong>'+state.wallet.slots+'</strong><small>مساحات تطبيقاتي</small></div></div>'+
 '<div class="panel coin-offer"><div class="row" style="align-items:start"><div><div class="eyebrow">الميزة القادمة</div><h3>إضافة تطبيق ثانٍ</h3><p class="muted small">أول تطبيق مجاني دائماً. تقدر تفتح مساحة لتطبيق إضافي بالعملات المكتسبة.</p></div><span class="coin-price">'+ico("coins",18)+' '+ECONOMY.secondSlot+'</span></div>'+
 (state.wallet.slots>=2?'<div class="badge">'+ico("circleCheck",15)+' المساحة الثانية مفتوحة</div>': '<div class="wallet-progress"><span style="width:'+Math.min(100,state.wallet.balance/ECONOMY.secondSlot*100)+'%"></span></div><div class="row small muted" style="margin-bottom:13px"><span>رصيدك '+state.wallet.balance+'</span><span>متبقي '+remaining+'</span></div><button class="primary full" id="unlock-slot" '+(remaining?'disabled':'')+'>'+ico("lock",17)+' '+(remaining?'اجمع '+remaining+' عملة للفتح':'فتح مساحة تطبيق إضافي')+'</button>')+
 '</div><div class="panel"><h3>شلون تحصل على العملات؟</h3><div class="coin-earn"><span class="earn-icon">'+ico("check",20)+'</span><div><strong>تقرير اختبار مفيد ومقبول</strong><p>+25 هب كوين بعد قبول التقرير مرة واحدة لكل تطبيق باليوم، ولحد 5 تقارير يومياً.</p></div></div><div class="coin-earn"><span class="earn-icon">'+ico("shield",20)+'</span><div><strong>المصداقية أولاً</strong><p>ماكو عملات لمجرد فتح الرابط أو الانضمام، ولا مقابل تقييمات Google Play. الاختبار والمجموعات يبقون مجاناً.</p></div></div><div class="pane-note">بالمعاينة تگدر تحاكي قبول تقرير من «اختباراتي» حتى تشوف تغيّر الرصيد. النظام الحقيقي يحتاج اعتماد Firestore rules ومعاملات خادم موثوقة.</div></div>'+
 '<div class="panel"><h3>سجل الرصيد</h3>'+state.wallet.ledger.slice(0,8).map(x=>'<div class="profile-row"><span>'+ico(x.type==="report"?"check":"gift",18)+' '+esc(x.title)+'</span><strong class="'+(x.amount>0?'credit-in':'')+'">'+(x.amount>0?'+':'')+x.amount+'</strong></div>').join("")+'</div>';
}

function renderReport(a){return '<button class="back" id="back-tests">→ رجوع إلى اختباراتي</button><h2>تقرير اختبار: '+esc(a.name)+'</h2><div class="pane-note">هذا تقرير تجريبي محلي. في النسخة الفعلية يتبع قواعد Firestore وسجل الاختبار والمراجعة.</div><form id="report-form"><div class="field"><label for="report-text">شنو جرّبت؟ وشنو النتيجة؟ *</label><textarea id="report-text" minlength="15" maxlength="2000" required placeholder="اشرح الميزة اللي جرّبتها، النتيجة، وأي مشكلة واجهتك...">'+esc(state.reports[a.id]||"")+'</textarea></div><button class="primary full" type="submit">حفظ التقرير التجريبي</button></form>'}
function render(){const root=$("#app");if(state.view==="wallet")root.innerHTML=renderWallet();else if(state.view==="add")root.innerHTML=renderAdd();else if(state.view==="detail")root.innerHTML=renderDetail(lookup(state.focusId));else if(state.view==="report")root.innerHTML=renderReport(lookup(state.focusId));else root.innerHTML=({apps:renderApps,groups:renderGroups,tests:renderTests,account:renderAccount}[state.tab]||renderApps)();document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.tab===state.tab));renderGate();syncHeader()}
function renderGate(){if(state.joined){$("#gate").innerHTML="";return}$("#gate").innerHTML='<div class="overlay"><div class="welcome"><div class="brand-mark">♧</div><div class="eyebrow">الخطوة الأولى بعد إنشاء الحساب</div><h2>انضم إلى مجتمع المختبرين</h2><p>قبل ما تستخدم TesterHub، مطلوب الانضمام لمجموعة المختبرين. بعدين تقدر تستعرض كل التطبيقات، ولكل تطبيق رابط اشتراك Google Play خاص بيه.</p><div class="pane-note">هذه معاينة فقط: ماكو تحقق مباشر من عضوية Google Groups أو إنشاء حساب حقيقي.</div><p><a href="'+COMMUNITY+'" target="_blank" rel="noopener noreferrer" id="open-community">فتح مجموعة المختبرين ↗</a></p><label class="check"><input id="join-check" type="checkbox"><span>أقر بأني طلبت الانضمام للمجموعة، وأفهم أن كل تطبيق يتطلب اشتراكاً مستقلاً في اختباره المغلق.</span></label><button class="primary full" id="finish-join" disabled>إكمال الخطوة ودخول المعاينة</button></div></div>'}
async function resizedIcon(file){if(!file)return "";if(!["image/jpeg","image/png","image/webp"].includes(file.type)||file.size>2*1024*1024)throw Error("اختار PNG أو JPG أو WEBP بحجم لا يتجاوز 2MB");return new Promise((resolve,reject)=>{const img=new Image();const u=URL.createObjectURL(file);img.onload=()=>{try{const canvas=document.createElement("canvas");canvas.width=128;canvas.height=128;const ctx=canvas.getContext("2d");ctx.fillStyle="#253642";ctx.fillRect(0,0,128,128);let r=Math.min(128/img.width,128/img.height),w=img.width*r,h=img.height*r;ctx.drawImage(img,(128-w)/2,(128-h)/2,w,h);URL.revokeObjectURL(u);resolve(canvas.toDataURL("image/jpeg",.78))}catch(e){URL.revokeObjectURL(u);reject(e)}};img.onerror=()=>{URL.revokeObjectURL(u);reject(Error("تعذّر قراءة الأيقونة"))};img.src=u})}
document.addEventListener("click",async e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.tab){state.tab=b.dataset.tab;state.view="";state.search="";render();scrollTo(0,0);return}if(b.dataset.open){state.returnTab=state.tab;state.focusId=b.dataset.open;state.view="detail";state.visitedOptin=false;render();scrollTo(0,0);return}if(b.id==="add-app"){state.returnTab="apps";state.view=state.apps.length>=state.wallet.slots?"wallet":"add";render();return}if(b.id==="back"){state.view="";state.tab=state.returnTab||"apps";render();return}if(b.id==="back-tests"){state.view="";state.tab="tests";render();return}if(b.id==="back-wallet"){state.view="";render();return}if(b.id==="balance-pill"){state.view="wallet";render();return}if(b.id==="unlock-slot"){if(state.wallet.slots>=2||state.wallet.balance<ECONOMY.secondSlot){notify("رصيد العملات غير كافٍ");return}state.wallet.balance-=ECONOMY.secondSlot;state.wallet.slots=2;state.wallet.ledger.unshift({id:"second-slot",type:"redeem",amount:-ECONOMY.secondSlot,day:DAY(),title:"فتح مساحة تطبيق إضافي"});persist();state.view="add";render();notify("فتحت مساحة ثانية بتجربة محلية");return}if(b.dataset.approve){approveDemoReport(b.dataset.approve);return}if(b.id==="finish-join"){if($("#join-check")?.checked){state.joined=true;persist();render();notify("تم الدخول إلى المعاينة، بدون تحقق فعلي من عضوية Google")};return}if(b.id==="open-play"){const a=lookup(state.focusId);if(validUrl(a?.play,["play.google.com"])){window.open(a.play,"_blank","noopener,noreferrer");state.visitedOptin=true}else notify("رابط Google Play غير صالح");return}if(b.id==="join-test"){if(!state.visitedOptin){notify("افتح رابط Google Play أولاً، ثم ارجع لتأكيد إقرارك");return}if(!state.tests.includes(state.focusId)){state.tests.push(state.focusId);persist();render();notify("أضيف إلى اختباراتي محلياً؛ لم يتم التحقق من Google Play")}return}if(b.dataset.report){state.focusId=b.dataset.report;state.view="report";render();return}if(b.id==="show-journey"){$("#journey")?.scrollIntoView({behavior:"smooth",block:"start"});return}
if(b.id==="save-profile"){const name=$("#profile-name")?.value?.trim();if(!name||name.length<2||name.length>80){notify("اسم الحساب يجب أن يكون من حرفين إلى 80 حرفاً");return}state.profile.name=name;persist();render();notify("حُفظ الملف الشخصي محلياً فقط");return}
if(b.id==="profile-my-apps"){state.tab="apps";state.view="";render();return}
if(b.id==="profile-my-tests"){state.tab="tests";state.view="";render();return}
if(b.id==="profile-privacy"){notify("سيُربط هذا القسم بإعدادات الخصوصية الحالية عند تكامل Firebase");return}
if(b.id==="reset-demo"){if(confirm("هل تريد مسح بيانات المعاينة المحلية فقط؟")){localStorage.removeItem(KEY);location.reload()}return}});
document.addEventListener("change",async e=>{if(e.target.id==="join-check"){$("#finish-join").disabled=!e.target.checked}if(e.target.id==="profile-photo"){const chosen=e.target.files?.[0];if(!chosen)return;const name=$("#profile-name")?.value?.trim();try{const resized=await resizedIcon(chosen);if(name&&name.length>=2&&name.length<=80)state.profile.name=name;state.profile.image=resized;persist();render();notify("تم تحديث صورة المعاينة محلياً")}catch(err){notify(err.message||"تعذّر حفظ الصورة")}}});
document.addEventListener("input",e=>{if(e.target.id==="search"){state.search=e.target.value;const matches=apps().filter(a=>(a.name+" "+a.developer).toLocaleLowerCase().includes(state.search.toLocaleLowerCase()));$("#app-list").innerHTML=matches.length?matches.map(appRow).join(""):'<div class="empty">ماكو تطبيق بهذا الاسم</div>'}});
document.addEventListener("submit",async e=>{if(e.target.id==="app-form"){e.preventDefault();if(state.apps.length>=state.wallet.slots){notify("وصلت للحد المتاح من التطبيقات. افتح مساحة إضافية بالعملات");state.view="wallet";render();return}const get=id=>$("#"+id).value.trim();const name=get("app-name"),developer=get("app-developer"),play=get("app-play"),desc=get("app-desc"),tasks=get("app-tasks");if(!validUrl(play,["play.google.com"])){notify("رابط Play يجب أن يكون على play.google.com وبصيغة https");return}if(name.length<2||developer.length<2||desc.length<10||tasks.length<10){notify("رجاءً اكتب أسماء صحيحة ووصفاً ومهاماً واضحة");return}try{const image=await resizedIcon($("#app-icon").files[0]);state.apps.unshift({id:"local-"+Date.now(),name,developer,play,desc,tasks,image,icon:"◈",tone:"teal",reward:20});persist();state.view="";state.search="";render();notify("تمت إضافة التطبيق للمعاينة فقط، بدون نشر")}catch(err){notify(err.message)}return}if(e.target.id==="report-form"){e.preventDefault();const body=$("#report-text").value.trim();if(body.length<15){notify("التقرير يحتاج تفاصيل أكثر");return}state.reports[state.focusId]=body;persist();state.view="";state.tab="tests";render();notify("حُفظ التقرير محلياً دون XP حقيقية");return}});
render();
</script>
