<meta name="robots" content="noindex">
<title>مركز المساعدة | TesterHub</title>
<!-- The help center lives inside the app; this address keeps /help and the draft's old links working. -->
<script>
(function () {
  var m = (location.hash || '').match(/^#(category|article)\/([a-z0-9-]{1,60})$/);
  location.replace('../#help' + (m ? '/' + m[1] + '/' + m[2] : ''));
})();
</script>
<noscript><meta http-equiv="refresh" content="0;url=../#help"></noscript>
</head>
<body><p><a href="../#help">فتح مركز المساعدة</a></p></body>
</html>
