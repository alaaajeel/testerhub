1.55}.article-link small{display:block;color:var(--muted);font-size:10px}.chev{margin-right:auto;font-size:22px;color:#9bb0ce}.support{border:1px solid #dbe7f8;border-radius:16px;padding:16px;margin-top:25px;background:#fff;display:flex;align-items:center;gap:11px}.support strong{font-size:13px}.support p{font-size:11px;color:var(--muted);margin:2px 0}.support .action{margin-right:auto;background:#0c9d76;color:#fff;text-decoration:none;padding:9px 11px;border-radius:11px;font-size:11px;font-weight:700;white-space:nowrap;border:0}.bottom{position:fixed;bottom:0;left:0;right:0;z-index:20;padding-bottom:env(safe-area-inset-bottom);background:#fff;border-top:1px solid #e0e9f6;box-shadow:0 -2px 12px #102e5a13}.nav{max-width:800px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr)}.nav a{display:grid;place-items:center;text-decoration:none;color:#7787a5;padding:8px 0 5px;gap:0;font-size:10px}.nav a svg{width:20px;height:20px;stroke-width:1.7}.nav a.active{color:#0c61bd;font-weight:800}.nav a.active:before{content:"";width:24px;height:3px;background:#0c61bd;position:absolute;top:0;border-radius:0 0 4px 4px}.nav a{position:relative}.hidden{display:none!important}.empty{text-align:center;background:#fff;border:1px dashed #d6e0ee;padding:24px;color:#637994;border-radius:16px}.back{display:inline-flex;align-items:center;gap:4px;background:transparent;border:0;color:#245fa4;font-weight:800;font-size:12px;margin-bottom:12px;padding:5px 0}.article-card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:18px 15px}.article-card h2{font-size:20px;line-height:1.45;margin:0 0 6px}.article-card .meta{font-size:11px;color:#7c8ca8;border-bottom:1px solid #e9eff8;padding-bottom:13px}.article-card p{font-size:13px}.article-card ol{padding-right:23px;margin:18px 0}.article-card li{margin:0 0 14px;padding-right:6px}.article-card li::marker{font-weight:800;color:#1464bf}.article-card li strong{display:block;font-size:13px}.article-card li span{font-size:12px;color:#627695}.notice{background:#f0f6ff;border:1px solid #d8e8ff;color:#375d93;padding:12px;border-radius:12px;font-size:12px;margin:16px 0}.mini-row{display:flex;flex-wrap:wrap;gap:8px}.pill{display:inline-flex;align-items:center;gap:5px;border-radius:30px;background:#edf5ff;color:#2d70c6;padding:3px 9px;font-size:10px;font-weight:800}.faq{border:1px solid #e4ebf6;border-radius:13px;margin:9px 0;background:#fff;overflow:hidden}.faq summary{cursor:pointer;padding:12px;font-size:12px;font-weight:800;list-style:none}.faq summary:after{content:'+';float:left;font-size:19px;color:#5080ba;line-height:1}.faq[open] summary:after{content:'−'}.faq p{margin:0;padding:0 12px 13px;font-size:12px;color:#637794}.tagline{font-size:11px;color:#7486a1;margin:15px 1px 0}.results-head{font-size:13px;font-weight:800;margin-bottom:12px}@media(min-width:720px){body{font-size:15px}.hero{padding:22px 32px 55px}.search{margin:-26px 30px 0}.content{padding:23px 30px}.categories{grid-template-columns:repeat(4,1fr)}.hero h1{font-size:30px}.category{min-height:150px}}@media(max-width:340px){.support{flex-wrap:wrap}.support .action{margin-right:0}}

<div id="supportModal" class="support-modal" hidden role="presentation"><section class="support-dialog" role="dialog" aria-modal="true" aria-labelledby="supportTitle">
<h2 id="supportTitle">تواصل مع الدعم</h2><p>اختار الطريقة المناسبة حتى نساعدك بمشكلتك.</p>

<script>
/* Prototype content. Admin-managed articles are a planned integration, not connected in this preview. */

// Integration hooks: configure on same origin before this script if the host app supports them.
// window.TESTERHUB_HELP_CONFIG = { openSupport: () => ..., telegramUrl: 'https://t.me/YOUR_OFFICIAL_SUPPORT' }
const helpConfig=window.TESTERHUB_HELP_CONFIG||{};
const supportModal=document.getElementById('supportModal'),supportHint=document.getElementById('supportHint');
const supportTelegram=document.getElementById('supportTelegram');
if(typeof helpConfig.telegramUrl==='string'&&/^https:\/\/t\.me\/[a-zA-Z0-9_]+\/?$/.test(helpConfig.telegramUrl)){
  supportTelegram.href=helpConfig.telegramUrl;supportTelegram.hidden=false;
}
function openSupportModal(){
  supportHint.textContent=typeof helpConfig.openSupport==='function'
   ?'اضغط طلب دعم حتى تفتح مراسلاتك داخل TesterHub.'
   :'هذه معاينة فقط. سيعمل زر المراسلات بعد دمجه بالتطبيق.';
  supportModal.hidden=false;document.getElementById('supportInside').focus();
}
function closeSupportModal(){supportModal.hidden=true;}
document.getElementById('supportClose').addEventListener('click',closeSupportModal);
supportModal.addEventListener('click',e=>{if(e.target===supportModal)closeSupportModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!supportModal.hidden)closeSupportModal();});
document.getElementById('supportInside').addEventListener('click',()=>{
  if(typeof helpConfig.openSupport!=='function'){
    supportHint.textContent='الدعم داخل التطبيق قيد الربط. لا توجد تذكرة مرسلة حالياً.';
    return;
  }
  try{const result=helpConfig.openSupport();if(result&&typeof result.catch==='function')result.catch(()=>{supportHint.textContent='تعذر فتح الدعم. جرّب مرة ثانية.';});else closeSupportModal();}
  catch{supportHint.textContent='تعذر فتح الدعم. جرّب مرة ثانية.';}
});

const entries=[
{id:'ready-email',cat:'tester',title:'شلون أفعّل الظهور وأشارك بريدي بأمان؟',desc:'فرق ظهور حسابك عن مشاركة البريد للمطور',steps:[['فعّل التوفّر','من إعدادات حسابك، خلي حالتك متاح للاختبار حتى المطورين يگدرون يختاروك للدعوات.'],['راجع مشاركة البريد','وافق على مشاركة عنوان بريد Google مع المطور المعني عند الحاجة للاختبارات بقائمة الإيميلات، ولا تخليه ظاهراً للعامة.'],['استخدم الحساب الصحيح','البريد المستخدم للاختبار لازم يطابق حساب Google المؤهّل في Play Console أو عضوية Google Group.'],['تگدر تغيّر قرارك','توفّرك للدعوات مو نفس موافقتك على كشف بريدك. راجع خيارات الخصوصية متى ما تريد.']],notice:'لا يوجد شرط أن يكون بريدك الإلكتروني معروضاً بشكل عام ودائم. معلوماتك تُشارك بحدود الحاجة وبموافقتك.'},
{id:'missing-invites',cat:'faq',title:'ليش ما توصلني دعوات للاختبار؟',desc:'خطوات حل مشكلة عدم وصول الدعوات',steps:[['تأكد من حسابك','سجّل الدخول وتحقق من تأكيد البريد وتفعيل توفرك للاختبار.'],['تحقق من الدعوات','افتح اختباراتك والإشعارات، لأن الدعوة ممكن تكون بانتظار القبول.'],['انضم إلى مجموعة Google','إذا التطبيق يعتمد Google Groups، انضم إلى المجموعة بحساب Play نفسه وانتظر قبول العضوية عند الحاجة.'],['افتح رابط التطبيق','عضوية المجموعة ما تعني الاشتراك تلقائياً؛ لازم تفتح opt-in لكل تطبيق.'],['تواصل مع الدعم','إذا أكملت الخطوات وباقي ما ظهرت الفرصة، راسل الدعم مع اسم التطبيق بدون نشر بريدك علناً.']],notice:'عدد التطبيقات والدعوات المتاحة يعتمد على المطورين وليس مضموناً لكل حساب.'},
{id:'developer-ready',cat:'developer',title:'قائمة جاهزية نشر اختبار مغلق',desc:'راجع إعداد التطبيق قبل إرسال الدعوات',steps:[['جهز الاختبار بـ Play Console','راجع حالة مسار الاختبار المغلق وأهلية الاختبار وطريقة الوصول المعتمدة.'],['حدد طريقة الوصول','استخدم مجموعة Google أو قائمة إيميلات بحسب إعداد المسار الفعلي، ولا تغيّر اختباراً جارياً دون فحص الأثر.'],['أضف رابط opt-in','تأكد من أن الرابط تابع لتطبيقك الصحيح ويعمل بحساب مختبر مؤهل.'],['اكتب المهام','جهز تعليمات تجربة واضحة للمختبر ومواعيد المتابعة.'],['راجع الإحصائيات','الدعوة أو التقرير في TesterHub ليست إثبات اشتراك رسمي على Google Play.']],notice:'هذه قائمة فحص داخل مركز المساعدة وليست فحصاً آلياً لحساب Google Play Console.'},

{id:'what-is',cat:'start',title:'شنو هي منصة TesterHub؟',desc:'فكرة المنصة وطريقة الاستفادة منها',steps:[['الفكرة','TesterHub منصة تساعد المطورين ينظمون اختبار تطبيقاتهم، والمختبرين يشاركون ويرسلون ملاحظات مفيدة.'],['اختار دورك','تگدر تستخدم واجهة المختبر للمشاركة، وواجهة المطور لعرض تطبيقاتك وإدارة التقارير.'],['تذكير مهم','TesterHub خدمة مستقلة، مو تابعة لشركة Google، ولا تضمن وحدها قبول طلب نشر التطبيق.']]},
{id:'register',cat:'start',title:'شلون أسجّل حساب جديد؟',desc:'التسجيل وتأكيد البريد الإلكتروني',steps:[['افتح المنصة','افتح TesterHub من المتصفح على هاتفك.'],['أنشئ حساب','اختار التسجيل وأدخل بياناتك الصحيحة وحدّد دورك.'],['أكد البريد','افتح رسالة التأكيد في بريدك وارجع سجّل الدخول.']]},
{id:'tester-first',cat:'tester',title:'شلون أبدأ أول اختبار؟',desc:'من الدعوة إلى تثبيت التطبيق',steps:[['افتح واجهة المختبر','سجّل الدخول واختار واجهة المختبر، وشوف التطبيقات والدعوات المتاحة.'],['اقبل الدعوة أو اطلب المشاركة','اتبع الطريقة المتاحة لذلك التطبيق داخل TesterHub.'],['اشترك من Google Play','افتح رابط الانضمام للاختبار الخاص بالتطبيق، ووافق باستخدام حساب Google المؤهّل.'],['نزّل التطبيق','ثبّته من Google Play، ثم أكد بدء المشاركة داخل TesterHub.'],['جرّب وأرسل تقريرك','نفّذ مهمة اليوم وارفع ملاحظتك من نموذج التقرير.']] ,notice:'قبول الدعوة أو تسجيل تقرير داخل TesterHub مو دليل رسمي على اشتراكك في اختبار Google Play.'},
{id:'tester-group',cat:'tester',title:'شلون أنضم لمجموعة المختبرين؟',desc:'Google Groups ورابط اختبار كل تطبيق',steps:[['افتح رابط المجموعة','ادخل على groups.google.com/g/testerhubiq بحساب Google المستخدم في Play.'],['اطلب الانضمام','كمّل طلب العضوية حسب إعدادات المجموعة وانتظر الموافقة إن لزمت.'],['اشترك بكل تطبيق','عضوية المجموعة وحدها ما تشتركك تلقائياً بكل التطبيقات؛ افتح رابط opt-in لكل تطبيق بشكل منفصل.']],notice:'لا تغيّر حساب Google بين المجموعة وGoogle Play إذا كانت أهلية الاختبار مرتبطة به.'},
{id:'daily-report',cat:'tester',title:'شلون أرسل تقرير الاختبار اليومي؟',desc:'التجربة الفعلية وحفظ الملاحظات',steps:[['جرّب التطبيق','افتح التطبيق على جهازك وجرّب المهمة المطلوبة فعلياً.'],['ارجع إلى TesterHub','افتح اختبار اليوم وحدد نتيجة التجربة.'],['دوّن ملاحظتك','اكتب وصفاً واضحاً لما نجح أو لم ينجح.'],['ارسل وتأكد من الحفظ','انتظر رسالة نجاح حفظ التقرير. لا تفترض أنه انحفظ إذا انقطع الإنترنت.']],notice:'المدة والنقاط داخل TesterHub منفصلة عن تحقق Google Play من الاشتراك والاختبار.'},
{id:'tester-progress',cat:'tester',title:'شلون أعرف تقدمي خلال 14 يوم؟',desc:'الأيام والتقارير والاشتراك الرسمي',steps:[['افتح اختباراتي','شوف التطبيق وتقدم الأيام وعدد التقارير المحفوظة.'],['راجع المهام اليومية','التقرير المحفوظ ينحسب داخل المنصة حسب قواعدها، أما مرور يوم وحده ما يعني وصول التقرير.'],['راجع Play Console عند الحاجة','المطور هو اللي يقدر يتابع الأهلية الرسمية للاختبار من Play Console.']]},
{id:'add-app',cat:'developer',title:'شلون أضيف تطبيقي إلى TesterHub؟',desc:'إنشاء التطبيق وإرسال الدعوات',steps:[['جهز رابط الاختبار','من Google Play Console جهز الاختبار المغلق ورابط الانضمام المناسب.'],['افتح إضافة تطبيق','من واجهة المطور، اضغط إضافة تطبيق جديد.'],['عبّئ التفاصيل','اكتب الاسم والرابط والمهام المطلوبة.'],['اختار المختبرين','أكمل اختيار طريقة المشاركة المتاحة بالإصدار الحالي، ثم ارسل الدعوات.'],['راجع النتائج','تابع الردود والتقارير من تفاصيل التطبيق.']],notice:'واجهة المشاركة الذاتية المخطط لها قد تختلف عن نظام الدعوات الموجود حالياً؛ يعتمد الشرح النهائي على النسخة التي تُنشر.'},
{id:'console-group',cat:'developer',title:'شلون أستخدم مجموعة Google للاختبار؟',desc:'بريد المجموعة وإعداد Play Console',steps:[['جهز اختباراً مغلقاً','افتح Google Play Console ووصل لقسم المختبرين في مسار الاختبار المناسب.'],['استخدم المجموعة','إذا كان هذا المسار مضبوطاً على Google Groups، استخدم testerhubiq@googlegroups.com وفق إعداداته.'],['وفّر رابط الاشتراك','انشر رابط opt-in الصحيح لذلك التطبيق في TesterHub.'],['لا تغيّر اختبارات جارية بلا تجربة','إذا تطبيقك الحالي يعتمد قائمة إيميلات، لا تغيّر المسار أثناء فترة الاختبار بدون التأكد من أثره.']],notice:'وجود المجموعة لا يثبت أن المستخدم اشترك في اختبار تطبيقك؛ عليه الانضمام من رابط التطبيق.'},
{id:'developer-reports',cat:'developer',title:'شلون أتابع المختبرين والتقارير؟',desc:'مراجعة الملاحظات ونشاط المشاركين',steps:[['افتح تطبيقاتي','اختار التطبيق وافتح تفاصيله.'],['راجع المشاركات','ميّز بين الدعوة، والقبول، وتأكيد الانضمام، والتقارير اليومية.'],['راجع التقرير','اقرأ ملاحظات المختبر وقرر قبوله أو طلب توضيح إذا متاح.'],['تواصل عند الحاجة','استخدم مراسلة المختبر حتى توضّح المطلوب.']],notice:'آخر دخول إلى TesterHub مو إثبات أن المختبر فتح التطبيق المختبَر فعلياً.'},
{id:'install-pwa',cat:'faq',title:'شلون أثبّت TesterHub على أندرويد؟',desc:'إضافة المنصة إلى الشاشة الرئيسية',steps:[['افتح الموقع في Chrome','ادخل لرابط TesterHub من متصفح أندرويد.'],['افتح قائمة المتصفح','اضغط النقاط الثلاث في الأعلى.'],['اختار تثبيت التطبيق','إذا ظهر خيار «تثبيت التطبيق» استخدمه، أو خيار «إضافة إلى الشاشة الرئيسية» حسب المتصفح.']]},
{id:'not-showing',cat:'faq',title:'ليش التطبيق ما يظهر عندي؟',desc:'الحساب والدعوات وروابط الاختبار',steps:[['تأكد من الحساب','تحقق أنك داخل بواجهة المختبر وبالحساب الصحيح.'],['راجع الدعوات','بعض التطبيقات تظهر فقط للمختبرين المختارين أو عند توفر المشاركة.'],['تحقق من Google Play','إذا ظهر في TesterHub وما انفتح بالمتجر، راجع رابط opt-in وأهلية حساب Google.'],['راسل المطور','إذا استمرت المشكلة استخدم المحادثة أو الدعم.']]},
{id:'xp',cat:'faq',title:'متى تنضاف نقاط XP؟',desc:'النقاط بعد مراجعة التقرير',steps:[['ارسل التقرير','اكتب تقريراً مفيداً بعد تجربة التطبيق.'],['انتظر المراجعة','النقاط الموثقة ما تنضاف إلا بعد قبول المطور للتقرير وفق نظام المكافآت الحالي.'],['راجع نقاطك','افتح دوري المساهمين والنقاط حتى تشوف المستوى والأوسمة.']]},
{id:'account',cat:'faq',title:'نسيت كلمة المرور أو ما وصل التأكيد؟',desc:'استعادة الوصول للحساب',steps:[['راجع البريد','افحص الرسائل الواردة ومجلد الرسائل غير المرغوب بها.'],['استخدم استعادة كلمة المرور','من صفحة تسجيل الدخول اضغط «نسيت كلمة المرور» إذا متاح.'],['اطلب المساعدة','إذا ما انحلّت المشكلة، تواصل مع دعم المنصة من داخل الحساب.']]}
];

const cats={start:{title:'ابدأ من هنا',sub:'تعرف على TesterHub من الصفر',icon:'✦',color:'blue'},tester:{title:'دليل المختبر',sub:'الانضمام والاختبار والتقارير',icon:'✓',color:'green'},developer:{title:'دليل المطور',sub:'إضافة التطبيقات ومتابعة المختبرين',icon:'▣',color:'purple'},faq:{title:'الأسئلة الشائعة',sub:'حلول لأكثر الاستفسارات',icon:'؟',color:'orange'}};
const main=document.getElementById('main'),search=document.getElementById('search'),clear=document.getElementById('clear');
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function link(e){return `<button class="article-link" data-entry="${esc(e.id)}"><span class="sq">${cats[e.cat].icon}</span><span><span class="title">${esc(e.title)}</span><small>${esc(e.desc)}</small></span><span class="chev">‹</span></button>`}
function updateNav(hash){document.querySelectorAll('.nav a').forEach(a=>a.classList.toggle('active',a.hash===hash||(hash.startsWith('#article/')&&a.hash==='#home')))}
function render(){let hash=decodeURIComponent(location.hash||'#home'),term=search.value.trim().toLowerCase();clear.style.display=term?'block':'none';
 if(term){const matches=entries.filter(e=>[e.title,e.desc,cats[e.cat].title,...e.steps.flat()].join(' ').toLowerCase().includes(term));main.innerHTML=`<div class="results-head">نتائج البحث عن «${esc(term)}» — ${matches.length} نتيجة</div><div class="items">${matches.map(link).join('')||'<div class="empty">ما لگينا شرح مطابق. جرّب كلمات أبسط أو تواصل مع الدعم.</div>'}</div>`;updateNav('#home');return}
 if(hash.startsWith('#article/')){const id=hash.slice(9),e=entries.find(x=>x.id===id);if(!e){location.hash='#home';return}
 main.innerHTML=`<button class="back" data-back="${e.cat}">→ رجوع إلى ${esc(cats[e.cat].title)}</button><div class="article-card"><div class="mini-row"><span class="pill">${esc(cats[e.cat].title)}</span><span class="pill">شرح خطوة بخطوة</span></div><h2 style="margin-top:14px">${esc(e.title)}</h2><div class="meta">${esc(e.desc)}</div><ol>${e.steps.map(([title,desc])=>`<li><strong>${esc(title)}</strong><span>${esc(desc)}</span></li>`).join('')}</ol>${e.notice?`<div class="notice">ⓘ ${esc(e.notice)}</div>`:''}</div><div class="support"><div><strong>ما انحلّ استفسارك؟</strong><p>اطلب المساعدة من داخل TesterHub.</p></div><button class="action" data-support>تواصل مع الدعم</button></div>`; updateNav(hash);return}
 if(hash.startsWith('#category/')){const k=hash.slice(10);if(!cats[k]){location.hash='#home';return}main.innerHTML=`<button class="back" data-back="home">→ رجوع إلى مركز المساعدة</button><div class="eyeline"><h2>${cats[k].title}</h2><span>${entries.filter(e=>e.cat===k).length} شروحات</span></div><div class="items">${entries.filter(e=>e.cat===k).map(link).join('')}</div>${k==='faq'?'<p class="tagline">إذا ما لگيت جوابك، استخدم محادثة الدعم داخل التطبيق.</p>':''}`;updateNav(hash);return}
 main.innerHTML=`<div class="intro"><span class="spark">✧</span><div><strong>أول مرة تستخدم المنصة؟</strong><p>ابدأ من هنا وتعلّم شلون تشارك أو تضيف تطبيق.</p></div></div><div class="eyeline"><h2>شنو تريد تتعلّم؟</h2><span>اختار القسم المناسب</span></div><div class="categories">${Object.entries(cats).map(([key,c])=>`<button class="category" data-category="${key}"><span class="cat-icon ${c.color}">${c.icon}</span><strong>${c.title}</strong><small>${c.sub}</small></button>`).join('')}</div><h2 class="section-title">الأكثر طلباً</h2><div class="items">${['ready-email','missing-invites','tester-first','developer-ready','add-app','tester-group'].map(id=>link(entries.find(e=>e.id===id))).join('')}</div><div class="support"><div><strong>بعدك تحتاج مساعدة؟</strong><p>دز استفسارك إلى فريق TesterHub.</p></div><button class="action" data-support>تواصل مع الدعم</button></div><p class="tagline">نسخة تصميمية مستقلة — المحتوى يُراجع عند الربط بالمنصة الحالية.</p>`;updateNav('#home')}
function go(hash){search.value='';location.hash=hash;if(location.hash===hash)render();window.scrollTo({top:0,behavior:'smooth'})}
main.addEventListener('click',e=>{const entry=e.target.closest('[data-entry]'),cat=e.target.closest('[data-category]'),back=e.target.closest('[data-back]'),support=e.target.closest('[data-support]');if(entry)go('#article/'+entry.dataset.entry);else if(cat)go('#category/'+cat.dataset.category);else if(back)go(back.dataset.back==='home'?'#home':'#category/'+back.dataset.back);else if(support)openSupportModal();});
search.addEventListener('input',render);clear.addEventListener('click',()=>{search.value='';render();search.focus()});window.addEventListener('hashchange',()=>{search.value='';render()});render();
</script>
</body>
</html>
