name: Android V2 Preview APK

on:
  push:
    branches:
      - feature/android-v2-preview-20261112
    paths:
      - 'android-preview/**'
      - 'preview/v2/**'
      - '.github/workflows/android-v2-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK tools
        uses: android-actions/setup-android@v4
      - name: Install SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Copy bundled V2 preview HTML
        run: |
          mkdir -p android-preview/app/src/main/assets
          cp preview/v2/index.html android-preview/app/src/main/assets/index.html
          cp android-preview/session.js android-preview/app/src/main/assets/session.js
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android-preview/app/src/main/assets/index.html')
          t = p.read_text('utf-8')
          assert '</body>' in t and '<script>' in t
          p.write_text(t.replace('</body>', '<script src="session.js"></script>\n</body>'), 'utf-8')
          PY
      - name: Build debug APK
        working-directory: android-preview
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify APK file exists
        run: test -s android-preview/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload isolated APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TesterHub-V2-Preview-APK
          path: android-preview/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
