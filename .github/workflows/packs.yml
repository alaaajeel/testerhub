name: Exchange packs (coins and warnings)
# Every 15 minutes: pays new coins, and judges each finished day of every running pack. Safe to run any number of times.
on:
  schedule:
    - cron: '4,19,34,49 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: exchange-packs
  cancel-in-progress: false
jobs:
  judge:
    if: github.repository == 'alaaajeel/testerhub'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - id: secret
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Packs job is not set up yet: add the FIREBASE_SERVICE_ACCOUNT secret."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.secret.outputs.configured == 'true'
      - uses: actions/setup-node@v4
        if: steps.secret.outputs.configured == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev --ignore-scripts
        if: steps.secret.outputs.configured == 'true'
      - run: node scripts/run-packs.mjs
        if: steps.secret.outputs.configured == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
