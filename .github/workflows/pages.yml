name: Redirect old GitHub Pages address to Firebase Hosting
on:
  push:
    branches: [main]
    paths: [scripts/pages-redirect/**, .github/workflows/pages.yml]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: scripts/pages-redirect
      - id: deployment
        uses: actions/deploy-pages@v4
