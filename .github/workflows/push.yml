name: Push notifications
# GitHub runs schedules only from the default branch, and on a public repository these minutes are free.
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: push-notifications
  cancel-in-progress: false
jobs:
  send:
    # Forks have no secret and must not spend minutes failing.
    if: github.repository == 'alaaajeel/testerhub'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev --ignore-scripts
      - run: node scripts/send-push.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
