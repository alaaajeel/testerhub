<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b2a6b">
<meta name="robots" content="noindex,nofollow">
<title>إدارة TesterHub</title>
<link rel="icon" href="./assets/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{CSS}}">
<script src="./firebase-config.js"></script>
<script type="module" src="{{ADMIN}}"></script>
</head>
<body>
<header class="admin-bar"><span class="brand"><img src="./assets/brand-icon.svg" alt="" width="34" height="34">إدارة TesterHub</span><a href="./index.html">العودة للتطبيق</a></header>
<main class="admin-main">
 <section id="gate" class="card" role="status" aria-live="polite">جارٍ التحقق من الصلاحية…</section>
 <section id="console" hidden>
  <p id="identity" class="muted small"></p>
  <div id="flash" role="status" aria-live="polite"></div>
  <div id="metrics" class="stats"></div>
  <nav class="admin-tabs" aria-label="أقسام الإدارة">
   <button type="button" data-tab="flags">البلاغات</button>
   <button type="button" data-tab="deletionRequests">طلبات الحذف</button>
   <button type="button" data-tab="users">المستخدمون</button>
   <button type="button" data-tab="projects">التطبيقات</button>
   <button type="button" data-tab="issues">مشكلات الاختبار</button>
   <button type="button" data-tab="adminAuditLogs">سجل الإدارة</button>
  </nav>
  <section class="card">
   <div class="row between"><h2 id="listTitle"></h2><button class="btn ghost small" id="refresh" type="button">تحديث</button></div>
   <form id="search" class="admin-search" hidden><input name="email" type="email" dir="ltr" placeholder="البحث ببريد المستخدم الكامل"><button class="btn ghost small" type="submit">بحث</button></form>
   <div id="items" aria-live="polite"></div>
   <button id="loadMore" class="btn ghost small" type="button" hidden>عرض المزيد</button>
  </section>
  <p class="notice">الإيقاف يمنع الوصول إلى البيانات فوراً، لكنه لا يعطّل حساب الدخول نفسه؛ التعطيل والحذف النهائي يتمان من Firebase Console. راجع <a href="./docs-admin.html">دليل الإدارة</a>.</p>
 </section>
</main>
<div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
