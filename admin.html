<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#102e67">
<meta name="robots" content="noindex,nofollow">
<title>إدارة المنصة | TesterHub</title>
<link rel="icon" href="./assets/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#102e67;--blue:#1559b7;--mint:#07a077;--mint-soft:#dcf7ed;--bg:#f2f6fc;--ink:#172c50;--muted:#62758f;--line:#dbe5f3;--danger:#b5304a;--danger-soft:#fff0f2;--amber:#8c5811;--amber-soft:#fff0cd;--blue-soft:#e8f1ff}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.7}
a{color:inherit}button,input{font:inherit;color:inherit}button{cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}
:focus-visible{outline:3px solid #65aaeb;outline-offset:2px}
[hidden]{display:none!important}
.top{background:linear-gradient(120deg,#124085,#0d275f);color:#fff;padding:0 max(16px,calc((100vw - 1120px)/2));padding-top:env(safe-area-inset-top)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:68px}
.brand{display:flex;align-items:center;gap:11px;font-weight:700;font-size:17px}.brand img{height:38px;width:38px;border-radius:11px;background:#fff}
.back{border:1px solid #ffffff55;padding:8px 14px;border-radius:11px;text-decoration:none;font-size:13px;white-space:nowrap}
.back:hover{background:#ffffff1c}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs button{flex:none;background:none;border:0;border-bottom:3px solid transparent;color:#cfe0f7;padding:10px 14px 11px;font-weight:600;min-height:46px;font-size:14px}
.tabs button:hover{color:#fff}.tabs button.active{color:#fff;border-bottom-color:#2fdcae}
main{max-width:1120px;margin:0 auto;padding:22px 16px 64px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 4px 16px #1d45730a}
#gate{margin:48px auto;max-width:560px;text-align:center;line-height:2.1}
#gate a{color:var(--blue);font-weight:600}
.who{color:var(--muted);font-size:13px;margin:0 0 14px}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:10px;margin-bottom:18px}
.metric{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.metric small{display:block;color:var(--muted);font-size:12.5px}.metric strong{display:block;font-size:28px;line-height:1.35;color:var(--navy);font-weight:700}
.head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
h1{font-size:18px;margin:0;font-weight:700}
.tools{display:flex;gap:8px;flex:1 1 280px;min-width:0;justify-content:flex-end}
#search{flex:1 1 0}
.tools input{flex:1;width:100%;min-width:0;max-width:340px;min-height:42px;padding:8px 12px;border:1px solid #c6d5e8;border-radius:11px;background:#f8fbff}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:8px 14px;border-radius:11px;border:1px solid transparent;background:var(--blue);color:#fff;font-weight:600;font-size:13.5px;white-space:nowrap}
.btn.soft{background:#fff;border-color:#c6d5e8;color:#16417d}.btn.soft:hover{background:var(--blue-soft)}
.btn.warn{background:#fff;border-color:#e6c98f;color:var(--amber)}.btn.warn:hover{background:var(--amber-soft)}
.btn.danger{background:#fff;border-color:#eab6c0;color:var(--danger)}.btn.danger:hover{background:var(--danger-soft)}
.btn.solid-danger{background:var(--danger);color:#fff}
.item{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 0;border-top:1px solid #e8eef7;flex-wrap:wrap}
.item:first-child{border-top:0}
.item>.info{flex:1 1 280px;min-width:0}
.item strong{display:block;font-weight:600;overflow-wrap:anywhere}
.item small{display:block;color:var(--muted);font-size:12.5px;overflow-wrap:anywhere}
.actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.tag{display:inline-block;background:var(--blue-soft);color:#21488a;border-radius:99px;font-size:11.5px;padding:3px 10px;font-weight:600;white-space:nowrap}
.tag.good{background:var(--mint-soft);color:#04785a}.tag.warn{background:var(--amber-soft);color:var(--amber)}.tag.bad{background:var(--danger-soft);color:var(--danger)}
.detail{flex-basis:100%;background:#f6f9fe;border-radius:12px;padding:10px 13px;font-size:13px;overflow-wrap:anywhere}
.none{color:var(--muted);text-align:center;padding:26px 8px;margin:0}
#more{margin-top:12px;width:100%}
#toast{position:fixed;z-index:40;inset-inline:16px;bottom:calc(20px + env(safe-area-inset-bottom));margin:auto;max-width:460px;background:#102e54;color:#fff;padding:12px 16px;border-radius:13px;text-align:center;font-size:14px;opacity:0;visibility:hidden;transform:translateY(8px);transition:.2s}
#toast.show{opacity:1;visibility:visible;transform:none}#toast.error{background:var(--danger)}
dialog{border:0;border-radius:18px;width:min(92vw,460px);padding:22px;color:var(--ink);box-shadow:0 22px 70px #071a4166}
dialog::backdrop{background:#061b3c8a}
dialog h2{margin:0 0 8px;font-size:17px}dialog p{margin:0 0 10px;color:var(--muted);white-space:pre-line}
dialog label{display:block;font-weight:600;font-size:13.5px;margin-bottom:6px}
dialog input{width:100%;min-height:44px;padding:9px 12px;border:1px solid #c6d5e8;border-radius:11px}
dialog footer{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
@media(max-width:560px){.brand span{display:none}.item .actions{width:100%}.tools{flex-basis:100%}.tools input{max-width:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<script defer src="./firebase-config.js"></script>
<script defer src="./src/services/deletion.js"></script>
<script type="module" src="./src/admin.js"></script>
</head>
<body>
<header class="top">
 <div class="bar"><div class="brand"><img src="./assets/brand-icon.svg" alt="">TesterHub <span>لوحة الإدارة</span></div><a class="back" href="./index.html">العودة للتطبيق</a></div>
 <nav class="tabs" id="tabs" aria-label="أقسام الإدارة" hidden>
  <button type="button" data-tab="projects" class="active">التطبيقات</button>
  <button type="button" data-tab="users">المستخدمون</button>
  <button type="button" data-tab="issues">بلاغات المشاكل</button>
  <button type="button" data-tab="adminAuditLogs">سجل الإدارة</button>
 </nav>
</header>
<main>
 <section id="gate" class="card" role="status" aria-live="polite">جارٍ التحقق من صلاحية المشرف...</section>
 <section id="console" hidden>
  <p id="identity" class="who"></p>
  <div id="metrics" class="metrics"></div>
  <section class="card">
   <div class="head"><h1 id="listTitle">التطبيقات</h1>
    <div class="tools"><form id="search" class="tools" hidden><input id="searchInput" type="search" autocomplete="off"><button class="btn soft" id="searchButton" type="submit">بحث</button></form><button class="btn soft" id="refresh" type="button">تحديث</button></div></div>
   <div id="items" aria-live="polite"></div>
   <button id="more" class="btn soft" type="button" hidden>عرض المزيد</button>
  </section>
 </section>
</main>
<div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
