<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#102e67">
<meta name="robots" content="noindex,nofollow">
<title>إدارة المنصة | TesterHub</title>
<link rel="icon" href="./assets/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#102e67;--blue:#1859ac;--mint:#079f79;--bg:#f2f6fc;--ink:#172c50;--muted:#687b98;--line:#dbe5f3;--danger:#b9344d}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
a{color:inherit}button,input{font:inherit}button{cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}
header{background:linear-gradient(120deg,#124085,#0d275f);color:#fff;padding:19px max(16px,calc((100vw - 1100px)/2));display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:18px}.brand img{height:43px;width:43px;border-radius:12px}
.header-link{border:1px solid #ffffff60;padding:9px 15px;border-radius:12px;text-decoration:none;font-size:13px}
main{max-width:1100px;margin:28px auto;padding:0 16px 70px}
h1{margin:0 0 6px;font-size:27px}h2{font-size:18px;margin:0 0 15px}.hint{color:var(--muted);font-size:13px;margin:0 0 24px;line-height:2}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 6px 20px #1d45730c}
#gate{margin:45px auto;max-width:600px;line-height:2.1;text-align:center}
.nav{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0}.nav button{background:#fff;border:1px solid var(--line);padding:10px 21px;border-radius:12px;color:var(--ink);font-weight:700}.nav .active{color:#fff;background:var(--blue)}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}.metric small{color:var(--muted);display:block}.metric strong{font-size:31px;font-weight:800}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.btn{padding:10px 15px;border-radius:12px;border:0;background:var(--blue);color:#fff;font-weight:700}
.btn.secondary{background:#ebf1f9;color:#16417d}.btn.danger{background:#b9344d}.btn.small{font-size:12px;padding:7px 11px}
.table-wrap{overflow-x:auto}.items{display:grid;gap:9px}.item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px;border-radius:14px;background:#f6f9fe;border:1px solid #e5edf7}
.item strong{display:block;font-size:14px}.item small{display:block;color:var(--muted);font-size:12px;margin-top:5px;word-break:break-word}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tag{display:inline-block;background:#e1f6ec;color:#057b5d;border-radius:99px;font-size:11px;padding:5px 9px;font-weight:700}.tag.warn{background:#fff0d9;color:#94580e}
.message{margin:12px 0;padding:11px 15px;border-radius:12px;background:#e9f4ff;color:#184782}.message.error{background:#fff1f3;color:#9c2c48}
dialog{border:0;border-radius:22px;width:min(95vw,480px);padding:26px;box-shadow:0 22px 80px #071a4166;color:var(--ink);font:inherit;direction:rtl}dialog::backdrop{background:#061b3c8a}
label{display:block;font-weight:700;margin:15px 0 8px}input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid #afc5de;outline-color:#2673d4}dialog footer{display:flex;gap:9px;margin-top:20px;justify-content:flex-end}
.warning{color:#a72f48;font-size:13px;line-height:1.9}
@media(max-width:540px){header{padding:12px 16px}.brand{font-size:15px}.brand img{height:36px;width:36px}h1{font-size:23px}.item{align-items:flex-start;flex-direction:column}.actions{width:100%}}
</style>
<script defer src="./firebase-config.js"></script>
<script type="module" src="./src/admin.js"></script>
</head>
<body>
<header><div class="brand"><img src="./assets/brand-icon.svg" alt="">TesterHub <span>لوحة الإدارة</span></div><a class="header-link" href="./index.html">العودة للتطبيق</a></header>
<main>
<section id="gate" class="card" role="status" aria-live="polite">جارٍ التحقق من صلاحية المشرف...</section>
<section id="console" hidden>
 <h1>إدارة TesterHub</h1>
 <p id="identity" class="hint"></p>
 <div id="flash" role="status" aria-live="polite"></div>
 <div id="metrics" class="metrics"></div>
 <nav class="nav" aria-label="أقسام الإدارة">
  <button type="button" data-tab="projects" class="active">التطبيقات</button>
  <button type="button" data-tab="users">المستخدمون</button>
 </nav>
 <section class="card">
  <div class="topbar"><h2 id="listTitle">التطبيقات</h2><button class="btn secondary" id="refresh" type="button">تحديث</button></div>
  <div id="items" class="items" aria-live="polite"></div>
  <button id="loadMore" class="btn secondary" type="button" hidden style="margin-top:14px">عرض المزيد</button>
 </section>
 <section class="card" id="jobPanel" hidden style="margin-top:16px"><h2>متابعة الحذف النهائي</h2><p class="hint" id="jobState"></p><button id="continueJob" class="btn secondary" type="button">متابعة دفعة الحذف</button></section>
</section>
<dialog id="deleteDialog" aria-labelledby="deleteTitle">
 <h2 id="deleteTitle">حذف تطبيق نهائياً</h2>
 <p class="warning">الحذف غير قابل للتراجع. سيتم حذف المشروع وتقارير المختبرين ومحادثاتهم المرتبطة به فقط، مع الاحتفاظ بحسابات المستخدمين.</p>
 <p>للتأكيد اكتب اسم التطبيق التالي حرفياً: <strong id="targetName"></strong></p>
 <label for="confirmName">اسم التطبيق للتأكيد</label><input id="confirmName" autocomplete="off">
 <footer><button id="cancelDelete" class="btn secondary">إلغاء</button><button id="executeDelete" class="btn danger" disabled>حذف نهائي</button></footer>
</dialog>
</main>
</body>
</html>
